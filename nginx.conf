# Recursos de Juan. Comparte recursos.atvos.io con la landing del webinar: el nginx del host
# manda acá la raíz, /video, /biblioteca, /mkt/ y /api/contenido/; las áreas del webinar siguen allá.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # El proxy de archivos arma la URL con una variable: nginx resuelve ops.atvos.io en cada pedido.
    resolver 127.0.0.11 valid=300s ipv6=off;

    # El nginx del host hace proxy con HTTP/1.0: sin esto el JS sale sin comprimir.
    gzip on;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    set $csp "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com; media-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com https://www.loom.com https://www.instagram.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    # Los recursos viven en ATV Ops: mismo dominio para el navegador, sin CORS. Las descargas
    # y los pedidos vuelven como 302 al documento o a wa.me y se pasan tal cual.
    # Miniaturas y videos de las historias guardados en Ops. Solo las carpetas de Instagram y
    # YouTube: el resto de /uploads no tiene nada que hacer en una página pública.
    location ~ ^/api/contenido/archivos/((ig|yt)/[A-Za-z0-9_-]+\.(jpg|mp4))$ {
        proxy_pass https://ops.atvos.io/uploads/$1;
        proxy_ssl_server_name on;
        proxy_set_header Host ops.atvos.io;
        proxy_set_header Range $http_range;
        proxy_hide_header Set-Cookie;
        expires 7d;
    }

    # La lista: exacta y sin barra hacia Ops. Con barra, FastAPI responde con una redirección a
    # ops.atvos.io y el navegador no puede seguirla desde otro dominio.
    location = /api/contenido/ {
        proxy_pass https://ops.atvos.io/api/recursos-publicos;
        proxy_ssl_server_name on;
        proxy_set_header Host ops.atvos.io;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /api/contenido/ {
        proxy_pass https://ops.atvos.io/api/recursos-publicos/;
        proxy_ssl_server_name on;
        proxy_set_header Host ops.atvos.io;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Los assets de Vite llevan hash en el nombre: se cachean para siempre.
    location /mkt/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /mkt/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
        try_files /mkt/index.html =404;
    }
}
