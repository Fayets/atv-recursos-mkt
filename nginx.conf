# Recursos de Juan. Comparte recursos.atvos.io con la landing del webinar: el nginx del host
# manda acá /video, /biblioteca, /mkt/ y /api/contenido/; todo lo demás sigue yendo al webinar.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # El nginx del host hace proxy con HTTP/1.0: sin esto el JS sale sin comprimir.
    gzip on;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    set $csp "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    # Los recursos viven en ATV Ops: mismo dominio para el navegador, sin CORS. Las descargas
    # y los pedidos vuelven como 302 al documento o a wa.me y se pasan tal cual.
    location /api/contenido/ {
        proxy_pass https://ops.atvos.io/api/recursos-publicos/;
        proxy_ssl_server_name on;
        proxy_set_header Host ops.atvos.io;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Los assets de Vite llevan hash en el nombre: se cachean para siempre.
    location /mkt/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /mkt/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
        try_files /mkt/index.html =404;
    }
}
